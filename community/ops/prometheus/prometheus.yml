global:
  # Local evidence runs favor lower disk IO over second-level freshness.
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: paicoding-web
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8081

  - job_name: paicoding-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:10010

  - job_name: paicoding-auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8093

  - job_name: paicoding-message-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8095

  - job_name: paicoding-aigc-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8094

  - job_name: ragent-service
    metrics_path: /api/ragent/actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:9090
